name: CI - Windows Update Simulator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, build et documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: Vérification de la syntaxe JavaScript
        run: |
          set -euo pipefail
          find src tests scripts -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          node --check server.js

      - name: Tests unitaires
        run: npm test

      - name: Construction de la page HTML autonome
        run: |
          npm run build
          test -s dist/windows-update.html

      - name: Génération de la documentation JSDoc
        run: |
          npm run docs
          test -s docs/index.html

      - name: Publication de la page HTML
        uses: actions/upload-artifact@v7
        with:
          name: page-web-autonome
          path: dist/windows-update.html
          if-no-files-found: error
          retention-days: 14

      - name: Publication de la documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-jsdoc
          path: docs/
          if-no-files-found: error
          retention-days: 14
